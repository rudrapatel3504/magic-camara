<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <!-- Background Gradient for Deep Rider Back Sapphire Blue -->
    <linearGradient id="blueCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143e8c"/>
      <stop offset="50%" stop-color="#0b2461"/>
      <stop offset="100%" stop-color="#071942"/>
    </linearGradient>

    <!-- White Border & Card Corner Radius -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Intricate Pattern Tile -->
    <pattern id="cardPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 L 10 0 L 20 10 L 10 20 Z" fill="none" stroke="#2563eb" stroke-width="0.8" opacity="0.6"/>
      <circle cx="10" cy="10" r="2.5" fill="#60a5fa" opacity="0.4"/>
      <circle cx="0" cy="0" r="1.5" fill="#3b82f6" opacity="0.5"/>
      <circle cx="20" cy="0" r="1.5" fill="#3b82f6" opacity="0.5"/>
      <circle cx="0" cy="20" r="1.5" fill="#3b82f6" opacity="0.5"/>
      <circle cx="20" cy="20" r="1.5" fill="#3b82f6" opacity="0.5"/>
    </pattern>

    <!-- Circular Medallion Center -->
    <radialGradient id="sunburst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#1d4ed8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0b2461" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Crisp White Outer Playing Card Edge (Standard Bicycle Card White Border) -->
  <rect x="5" y="5" width="490" height="690" rx="28" ry="28" fill="#fdfdfd" stroke="#e2e8f0" stroke-width="4"/>

  <!-- Inner Blue Pattern Area -->
  <rect x="25" y="25" width="450" height="650" rx="16" ry="16" fill="url(#blueCardGrad)"/>

  <!-- Ornate Filigree Border Line -->
  <rect x="35" y="35" width="430" height="630" rx="12" ry="12" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
  <rect x="42" y="42" width="416" height="616" rx="8" ry="8" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.75"/>

  <!-- Intricate Pattern Background Fill -->
  <rect x="45" y="45" width="410" height="610" rx="6" ry="6" fill="url(#cardPattern)"/>

  <!-- Top Medallion Circle -->
  <g transform="translate(250, 220)">
    <circle cx="0" cy="0" r="85" fill="url(#sunburst)"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
    <circle cx="0" cy="0" r="74" fill="none" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="60" fill="#0b2461" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Intricate Cherub / Star motif -->
    <polygon points="0,-45 12,-15 45,-15 18,6 28,38 0,18 -28,38 -18,6 -45,-15 -12,-15" fill="#60a5fa" opacity="0.85"/>
    <circle cx="0" cy="0" r="16" fill="#ffffff"/>
    <circle cx="0" cy="0" r="10" fill="#1d4ed8"/>
  </g>

  <!-- Bottom Medallion Circle (Symmetrical Card Back) -->
  <g transform="translate(250, 480)">
    <circle cx="0" cy="0" r="85" fill="url(#sunburst)"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
    <circle cx="0" cy="0" r="74" fill="none" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="60" fill="#0b2461" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="0,45 12,15 45,15 18,-6 28,-38 0,-18 -28,-38 -18,-6 -45,15 -12,15" fill="#60a5fa" opacity="0.85"/>
    <circle cx="0" cy="0" r="16" fill="#ffffff"/>
    <circle cx="0" cy="0" r="10" fill="#1d4ed8"/>
  </g>

  <!-- Center Emblem Connector -->
  <g transform="translate(250, 350)">
    <circle cx="0" cy="0" r="30" fill="#071942" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="#2563eb" opacity="0.8"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
  </g>

  <!-- Corner Flourishes -->
  <path d="M 50 85 C 50 60 60 50 85 50" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M 450 85 C 450 60 440 50 415 50" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M 50 615 C 50 640 60 650 85 650" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M 450 615 C 450 640 440 650 415 650" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
</svg>
